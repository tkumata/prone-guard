<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>prone-guard 設定</title>
<style>body{font-family:sans-serif;max-width:42rem;margin:2rem auto;padding:0 1rem}label{display:block;margin:1rem 0}input,select{display:block;font:inherit;width:100%;box-sizing:border-box}input[type=checkbox]{display:inline;width:auto}button{font:inherit;padding:.4rem 1rem}[role=status]{white-space:pre-wrap}</style>
</head>
<body>
<h1>prone-guard 設定</h1>
<p id="health" role="status">状態を確認しています。</p>
<form id="settings">
<label for="wifi-ssid">Wi-Fi SSID<input id="wifi-ssid" name="wifi_ssid" maxlength="32" required autocomplete="off"></label>
<label for="wifi-password">Wi-Fi パスワード<input id="wifi-password" name="wifi_password" type="password" minlength="8" maxlength="63" autocomplete="new-password" placeholder="空欄なら保存済みの値を維持"></label>
<label for="bed-id">ベッド ID<input id="bed-id" name="bed_id" maxlength="64" pattern="[A-Za-z0-9_.\-]*" autocomplete="off"></label>
<label for="destination-url">送信先 URL<input id="destination-url" name="destination_url" type="url" maxlength="512" placeholder="https://edge.example/v1/measurements" autocomplete="off"></label>
<label for="device-key">デバイスキー<input id="device-key" name="device_key" type="password" pattern="[0-9a-f]{64}" minlength="64" maxlength="64" autocomplete="new-password" placeholder="空欄なら保存済みの値を維持"></label>
<p id="key-status"></p>
<label><input id="clear-device-key" type="checkbox">保存済みのデバイスキーを削除し、送信を停止する</label>
<label for="face-model">顔検知モデル<select id="face-model" name="face_model">
<option value="msrmnp">MSR + MNP (現行)</option>
<option value="espdet_pico_416">ESPDet-Pico 416</option>
</select></label>
<label><input id="tft-mirror-x" type="checkbox">左右を反転する</label>
<p>左右反転は TFT の深度マップだけに適用します。</p>
<p>ベッド ID または送信先 URL が空欄の場合は送信しません。保存するとデバイスが自動で再起動します。</p>
<button id="save" type="submit" disabled>保存</button>
<p id="settings-status" role="status"></p>
</form>
<p><a href="/health">デバイスの状態 JSON</a></p>
<script>
const element=id=>document.getElementById(id);
function showSettings(settings){
 element('wifi-ssid').value=settings.wifi_ssid;
 element('bed-id').value=settings.bed_id;
 element('destination-url').value=settings.destination_url;
 element('face-model').value=settings.face_model;
 element('tft-mirror-x').checked=settings.tft_mirror_x;
 element('key-status').textContent=settings.key_configured?'デバイスキー: 設定済み':'デバイスキー: 未設定';
}
async function loadSettings(){
 try{const response=await fetch('/settings',{cache:'no-store'});if(!response.ok)throw Error('設定を取得できません ('+response.status+')');showSettings(await response.json());element('save').disabled=false;}
 catch(error){element('settings-status').textContent=error.message;}
}
element('settings').addEventListener('submit',async event=>{
 event.preventDefault();element('save').disabled=true;const message=element('settings-status');message.textContent='保存中…';
 try{
  const response=await fetch('/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   wifi_ssid:element('wifi-ssid').value,wifi_password:element('wifi-password').value,
   bed_id:element('bed-id').value,destination_url:element('destination-url').value,
   device_key:element('device-key').value,clear_device_key:element('clear-device-key').checked,
   tft_mirror_x:element('tft-mirror-x').checked,face_model:element('face-model').value,
   restart_after_save:true
  })});
  if(!response.ok)throw Error('設定を保存できませんでした ('+response.status+')');
  element('wifi-password').value='';element('device-key').value='';element('clear-device-key').checked=false;
  message.textContent='保存しました。デバイスの再起動後にページを開き直してください。';
 }catch(error){message.textContent=error.message;element('save').disabled=false;}
});
async function poll(){
 try{const response=await fetch('/health',{cache:'no-store'});if(!response.ok)throw Error();const health=await response.json();element('health').textContent='Wi-Fi: '+health.wifi+' / 時刻: '+health.clock+' / カメラ: '+health.camera+' / 深度: '+health.depth+' / 送信: '+health.sender;}
 catch{element('health').textContent='デバイスの状態を取得できません。';}
 finally{setTimeout(poll,1000);}
}
loadSettings();poll();
</script>
</body></html>
