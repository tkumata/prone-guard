[package]
name = "prone-guard-edge"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
mdns-sd = "=0.21.6"
prost = "0.14"
rcgen = { version = "=0.14.10", default-features = false, features = [
    "ring",
    "pem",
    "x509-parser",
    "zeroize",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "json",
] }
ring = "0.17"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
sha2 = "0.11.1"
srp = "=0.7.0-rc.3"
subtle = "2.6.1"
time = "0.3"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "signal",
] }
zeroize = "1.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
